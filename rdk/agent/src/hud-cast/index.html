<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <title>Max · Navigation HUD</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #080e12;
      color: #f4f8f8;
      font:
        20px/1.4 system-ui,
        sans-serif;
    }
    header {
      height: 64px;
      padding: 10px 24px;
      display: flex;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
      color: #a5b8bf;
      border-bottom: 1px solid #25343b;
    }
    .brand {
      letter-spacing: 0.16em;
      font-size: 16px;
      white-space: nowrap;
    }
    #status {
      font-size: 16px;
      text-align: center;
    }
    button {
      color: #f4f8f8;
      background: #17232a;
      border: 1px solid #40545e;
      border-radius: 12px;
      min-height: 44px;
      padding: 8px 16px;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 3px solid #caff75;
      outline-offset: 3px;
    }
    main {
      height: calc(100dvh - 64px);
      min-height: 350px;
      padding: 20px;
      display: grid;
      grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.2fr);
      gap: 20px;
    }
    #join {
      grid-column: 1 / -1;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 10px 18px;
      min-width: 0;
    }
    .idle-topline {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 13px;
      color: #9bacb2;
    }
    .idle-kicker {
      letter-spacing: 0.16em;
    }
    #idle-ready {
      color: #caff75;
      white-space: nowrap;
    }
    .idle-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 32px;
      flex: 1;
      align-items: center;
    }
    #idle-date {
      color: #d8e1e4;
      font-size: clamp(17px, 2vw, 28px);
    }
    #idle-clock {
      font-size: clamp(80px, 12vw, 190px);
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: -0.055em;
      font-variant-numeric: tabular-nums;
      color: #f6faf8;
    }
    .idle-message {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 18px;
      color: #a5b8bf;
      font-size: 16px;
    }
    .idle-dot {
      width: 7px;
      height: 7px;
      background: #caff75;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .idle-weather-panel {
      border-left: 1px solid #33443d;
      padding-left: 32px;
    }
    #weather-city {
      font-size: 18px;
      color: #d8e1e4;
    }
    .weather-main {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 8px 0;
    }
    #weather-icon {
      font-size: clamp(42px, 5vw, 75px);
      color: #caff75;
    }
    #weather-temperature {
      font-size: clamp(48px, 6vw, 92px);
      line-height: 1.3;
      font-weight: 550;
    }
    #weather-condition {
      font-size: 22px;
    }
    #weather-detail,
    #weather-updated {
      margin-top: 8px;
    }
    .idle-connect {
      border: 1px solid #2c4037;
      border-radius: 18px;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      background: #101b16;
    }
    #idle-connect-copy {
      font-size: 18px;
      margin-top: 4px;
    }
    #address {
      color: #93a8b1;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .pairing {
      flex-shrink: 0;
      text-align: right;
    }
    #code {
      display: block;
      color: #caff75;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.3;
      letter-spacing: 0.15em;
      font-variant-numeric: tabular-nums;
    }
    @media (max-height: 550px) {
      #join {
        gap: 12px;
        padding: 0;
      }
      .idle-connect {
        padding: 12px 18px;
      }
      .idle-message {
        margin-top: 10px;
      }
    }
    @media (max-width: 550px) {
      #join {
        padding: 4px;
      }
      .idle-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .idle-weather-panel {
        border-left: 0;
        border-top: 1px solid #33443d;
        padding: 18px 0 0;
      }
      .idle-kicker {
        font-size: 10px;
        letter-spacing: 0.05em;
      }
      .idle-connect {
        padding: 14px;
        gap: 14px;
        flex-wrap: wrap;
      }
      .pairing {
        text-align: left;
      }
    }
    #guidance {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 16px;
    }
    #destination {
      color: #a5b8bf;
      font-size: clamp(16px, 2vw, 24px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .turn {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    #arrow {
      font: 700 clamp(48px, 6vw, 90px)/1 system-ui;
      color: #caff75;
      width: 1em;
      flex-shrink: 0;
      text-align: center;
    }
    #distance {
      color: #caff75;
      font-size: clamp(32px, 4.8vw, 72px);
      font-weight: 750;
      line-height: 1.2;
    }
    #instruction {
      font-size: clamp(20px, 2.8vw, 42px);
      margin: 0;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .label {
      color: #93a8b1;
      font-size: 13px;
      letter-spacing: 0.05em;
    }
    #upcoming {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    #upcoming li {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #25343b;
    }
    .turn-number {
      border: 1px solid #607480;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      text-align: center;
      flex-shrink: 0;
      font-size: 16px;
    }
    .turn-copy {
      min-width: 0;
      font-size: 16px;
    }
    .turn-copy span {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .turn-copy small {
      color: #93a8b1;
    }
    #trip {
      margin-top: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      border-top: 1px solid #33434b;
      padding-top: 14px;
    }
    #trip strong {
      display: block;
      font-size: clamp(19px, 2.5vw, 34px);
      white-space: nowrap;
    }
    #map-panel {
      min-width: 0;
      min-height: 0;
      position: relative;
      background: #202722;
      border: 1px solid #293c46;
      border-radius: 20px;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
      display: block;
    }
    #phone-map {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .map-top,
    .map-bottom {
      position: absolute;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }
    .map-top {
      top: 16px;
    }
    .map-bottom {
      bottom: 16px;
    }
    .map-top button {
      pointer-events: auto;
    }
    .compass {
      width: 38px;
      height: 48px;
      text-align: center;
      font-size: 14px;
      color: #bacbd2;
      background: #17232ae6;
      border-radius: 8px;
    }
    .compass b {
      display: block;
      color: #e5f0f3;
    }
    #scale {
      font-size: 13px;
      border-bottom: 2px solid #93a8b1;
      padding: 0 4px 3px;
      white-space: nowrap;
      text-align: center;
    }
    .street-map .map-bottom {
      bottom: 42px;
    }
    .street-map #scale {
      background: #17232ae6;
      border-radius: 4px;
    }
    #map-note {
      font-size: 13px;
      color: #93a8b1;
      background: #0d171de6;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .stale #status,
    .stale #distance,
    .stale #arrow {
      color: #ffbe69;
    }
    [hidden] {
      display: none !important;
    }
    @media (max-width: 900px) and (min-aspect-ratio: 1/1) {
      main {
        padding: 12px;
        gap: 12px;
      }
      #guidance {
        gap: 8px;
      }
      #upcoming li {
        padding: 6px 0;
      }
      #trip {
        padding-top: 8px;
      }
      .label {
        font-size: 11px;
      }
    }
    @media (max-aspect-ratio: 1/1) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(300px, 1fr);
        height: auto;
        min-height: calc(100dvh - 64px);
      }
      #map-panel {
        height: 48vh;
        min-height: 300px;
      }
      #join {
        grid-row: 1 / -1;
      }
      header {
        padding: 10px 12px;
        gap: 8px;
      }
      #status {
        font-size: 13px;
      }
      .brand {
        font-size: 12px;
      }
    }

    .music-card {
      display: flex;
      align-items: center;
      gap: 18px;
      border: 1px solid #30483c;
      border-radius: 18px;
      padding: 16px 20px;
      background: #101b16;
      min-width: 0;
    }
    .music-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #233b29;
      color: #caff75;
      font-size: 28px;
      flex-shrink: 0;
    }
    .music-copy {
      flex: 1;
      min-width: 0;
    }
    .music-title {
      font-size: 20px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 4px 0;
    }
    .music-artist {
      color: #a5b8bf;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .music-connection {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .music-connection button {
      min-height: 36px;
      font-size: 13px;
      padding: 4px 12px;
    }
    #nav-music .music-connection {
      display: none;
    }
    .music-controls {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .music-controls button {
      min-width: 48px;
      font-size: 20px;
      padding: 8px 12px;
    }
    .music-controls .music-toggle {
      color: #132010;
      background: #caff75;
      border-color: #caff75;
    }
    .music-controls button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .music-feedback {
      color: #ffce88;
      font-size: 13px;
      margin-top: 6px;
    }
    .music-progress {
      height: 3px;
      border: 0;
      width: 100%;
      accent-color: #caff75;
      display: block;
      margin-top: 10px;
    }
    #nav-music {
      margin-top: 14px;
      padding: 10px 12px;
      gap: 10px;
      flex-wrap: wrap;
    }
    #nav-music .music-icon,
    #nav-music .music-progress {
      display: none;
    }
    #nav-music .label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #nav-music .music-title {
      font-size: 16px;
    }
    #nav-music .music-controls {
      margin-left: auto;
      gap: 6px;
    }
    #nav-music .music-controls button {
      min-width: 44px;
      padding: 6px 10px;
    }
    @media (max-height: 700px) and (min-aspect-ratio: 1/1) {
      #guidance:has(#nav-music:not([hidden])) #upcoming-panel {
        display: none;
      }
      #nav-music {
        margin-top: 0;
      }
    }
    @media (max-height: 550px) {
      #join {
        gap: 4px;
      }
      #join .weather-main {
        margin: 4px 0;
      }
      #join #weather-temperature {
        font-size: 42px;
        line-height: 1.1;
      }
      #join #weather-icon {
        font-size: 32px;
      }
      #join #weather-condition {
        font-size: 18px;
      }
      #join #weather-detail,
      #join #weather-updated {
        margin-top: 4px;
        font-size: 11px;
      }
      #idle-music {
        padding: 8px 12px;
        gap: 12px;
      }
      #idle-music .music-icon {
        width: 38px;
        height: 38px;
      }
      #idle-music .music-title {
        font-size: 17px;
      }
      #idle-music .music-progress {
        display: none;
      }
      #join:has(#idle-music:not([hidden])) #idle-clock {
        font-size: clamp(60px, 10vw, 100px);
      }
      #join:has(#idle-music:not([hidden])) .idle-message {
        display: none;
      }
    }
    @media (max-width: 550px) {
      .music-card {
        flex-wrap: wrap;
        padding: 14px;
        gap: 12px;
      }
      .music-controls {
        margin-left: auto;
      }
    }
  </style>
  <header>
    <span class="brand">MAX / HUD</span><span id="status" role="status">正在连接显示服务…</span
    ><button id="fullscreen">全屏</button>
  </header>
  <main>
    <section id="join" aria-label="待机仪表盘">
      <div class="idle-topline">
        <span class="idle-kicker">READY FOR YOUR NEXT RIDE</span><span id="idle-ready">● HUD 已就绪</span>
      </div>
      <div class="idle-grid">
        <div class="idle-clock-panel">
          <div id="idle-date"></div>
          <div id="idle-clock">--:--</div>
          <div id="idle-zone" class="label">本地时间</div>
          <div class="idle-message">
            <span class="idle-dot"></span><span id="idle-message">随时出发 · 在手机上开始导航</span>
          </div>
        </div>
        <div class="idle-weather-panel">
          <div class="label" id="weather-city">当地天气</div>
          <div class="weather-main">
            <span id="weather-icon" aria-hidden="true">☁</span><strong id="weather-temperature">—</strong>
          </div>
          <div id="weather-condition">正在获取天气</div>
          <div id="weather-detail" class="label">天气数据来自高德</div>
          <div id="weather-updated" class="label"></div>
        </div>
      </div>
      <section id="idle-music" class="music-card" aria-label="音乐播放器" hidden>
        <div class="music-icon" aria-hidden="true">♫</div>
        <div class="music-copy">
          <div id="idle-music-source" class="label">手机音乐 · 蓝牙</div>
          <div id="idle-music-title" class="music-title">连接手机播放音乐</div>
          <div id="idle-music-artist" class="music-artist"></div>
          <progress
            id="idle-music-progress"
            class="music-progress"
            max="1"
            value="0"
            aria-label="播放进度"
            hidden
          ></progress>
          <div class="music-connection">
            <span id="idle-music-connection-status" class="label"></span
            ><button id="idle-music-connect" hidden>重新连接</button
            ><button id="idle-music-disconnect" hidden>断开并暂停自动连接</button>
          </div>
          <div id="idle-music-feedback" class="music-feedback" role="status" hidden></div>
        </div>
        <div id="idle-music-controls" class="music-controls">
          <button id="idle-music-previous" aria-label="上一首">⏮</button>
          <button id="idle-music-toggle" class="music-toggle" aria-label="播放">▶</button>
          <button id="idle-music-next" aria-label="下一首">⏭</button>
        </div>
      </section>
      <div class="idle-connect">
        <div>
          <div class="label">连接手机</div>
          <div id="idle-connect-copy">导航中选择「投屏到 HUD」</div>
          <div id="address"></div>
        </div>
        <div class="pairing">
          <div class="label">连接码</div>
          <strong id="code">—</strong>
          <div class="label" id="pairing-note">同一 Wi-Fi · 5 分钟有效</div>
        </div>
      </div>
    </section>
    <section id="guidance" hidden>
      <div id="destination"></div>
      <div class="turn">
        <span id="arrow" aria-hidden="true"></span>
        <div>
          <div class="label">下一步</div>
          <div id="distance"></div>
        </div>
      </div>
      <h1 id="instruction"></h1>
      <div id="upcoming-panel">
        <div class="label">接下来的路口</div>
        <ol id="upcoming"></ol>
      </div>
      <section id="nav-music" class="music-card" aria-label="音乐播放器" hidden>
        <div class="music-icon" aria-hidden="true">♫</div>
        <div class="music-copy">
          <div id="nav-music-source" class="label">手机音乐 · 蓝牙</div>
          <div id="nav-music-title" class="music-title">连接手机播放音乐</div>
          <div id="nav-music-artist" class="music-artist"></div>
          <progress
            id="nav-music-progress"
            class="music-progress"
            max="1"
            value="0"
            aria-label="播放进度"
            hidden
          ></progress>
          <div class="music-connection">
            <span id="nav-music-connection-status" class="label"></span
            ><button id="nav-music-connect" hidden>重新连接</button
            ><button id="nav-music-disconnect" hidden>断开并暂停自动连接</button>
          </div>
          <div id="nav-music-feedback" class="music-feedback" role="status" hidden></div>
        </div>
        <div id="nav-music-controls" class="music-controls">
          <button id="nav-music-previous" aria-label="上一首">⏮</button>
          <button id="nav-music-toggle" class="music-toggle" aria-label="播放">▶</button>
          <button id="nav-music-next" aria-label="下一首">⏭</button>
        </div>
      </section>
      <div id="trip">
        <div><span class="label">剩余里程</span><strong id="remaining"></strong></div>
        <div><span class="label">剩余时间</span><strong id="duration"></strong></div>
        <div><span class="label">预计到达</span><strong id="arrival"></strong></div>
      </div>
    </section>
    <section id="map-panel" hidden>
      <img id="phone-map" alt="手机实时高德地图" hidden />
      <svg id="map" viewBox="0 0 600 480" role="img" aria-label="导航路线示意图"></svg>
      <div class="map-top">
        <span class="compass" id="compass"><b>▲</b>N</span><button id="camera" aria-pressed="true">全程</button>
      </div>
      <div class="map-bottom"><span id="scale"></span><span id="map-note">路线示意 · 北向上</span></div>
    </section>
  </main>
  <script>
    const el = (id) => document.getElementById(id);
    const distance = (m) => (m < 1000 ? `${Math.round(m)} 米` : `${(m / 1000).toFixed(1)} 公里`);
    const arrow = (instruction) => {
      const text = instruction.toLowerCase();
      if (/掉头|u-turn/.test(text)) return "↶";
      if (/左|left/.test(text)) return "↰";
      if (/右|right/.test(text)) return "↱";
      if (/到达|destination|arrive/.test(text)) return "⚑";
      return "↑";
    };
    let following = true;
    let latestState;
    let loadedBasemap = null;
    let requestedBasemap = null;
    function loadBasemap(state) {
      if (!state.connected) {
        loadedBasemap = null;
        requestedBasemap = null;
        return;
      }
      if (!state.basemap || requestedBasemap === state.basemap.sequence) return;
      const metadata = state.basemap;
      requestedBasemap = metadata.sequence;
      const image = new Image();
      image.onload = () => {
        if (requestedBasemap !== metadata.sequence || !latestState?.connected) return;
        loadedBasemap = metadata;
        render(latestState);
      };
      image.onerror = () => {
        if (requestedBasemap === metadata.sequence) requestedBasemap = null;
      };
      image.src = `/cast/basemap?v=${metadata.sequence}`;
    }
    function worldPixel(point, zoom) {
      const size = 256 * 2 ** zoom;
      const latitude = (Math.max(-85, Math.min(85, point.lat)) * Math.PI) / 180;
      return [
        ((point.lon + 180) / 360) * size,
        ((1 - Math.log(Math.tan(latitude) + 1 / Math.cos(latitude)) / Math.PI) / 2) * size
      ];
    }
    let mapImageSequence = null;
    let mapImageLoaded = false;
    el("phone-map").onload = () => {
      mapImageLoaded = true;
      if (latestState) render(latestState);
    };
    el("phone-map").onerror = () => {
      mapImageLoaded = false;
      if (latestState) render(latestState);
    };
    let arrivalAt = null;
    let lastArrivalSequence = null;
    el("fullscreen").onclick = () => document.documentElement.requestFullscreen?.().catch(() => {});
    el("camera").onclick = () => {
      following = !following;
      if (latestState) render(latestState);
    };

    // Local metric projection: the phone has already converted coordinates to GCJ-02.
    // Follow mode shows a fixed neighborhood; overview includes the whole route.
    function cameraFor(frame, follow) {
      if (loadedBasemap) {
        const center = worldPixel(loadedBasemap.center, loadedBasemap.zoom);
        return {
          scale:
            (256 * 2 ** loadedBasemap.zoom) / (40075016.686 * Math.cos((loadedBasemap.center.lat * Math.PI) / 180)),
          project(p) {
            const pixel = worldPixel(p, loadedBasemap.zoom);
            return [300 + pixel[0] - center[0], 240 + pixel[1] - center[1]];
          }
        };
      }
      const origin = frame.position || frame.polyline[0];
      const factor = Math.max(0.01, Math.cos((origin.lat * Math.PI) / 180));
      const meters = (p) => ({ x: (p.lon - origin.lon) * 111320 * factor, y: (origin.lat - p.lat) * 111320 });
      const all = [...frame.polyline, ...(frame.position ? [frame.position] : [])].map(meters);
      let cx = 0,
        cy = 0,
        scale;
      if (follow && frame.position) {
        const radius = Math.min(1500, Math.max(250, frame.distance * 1.35));
        scale = 180 / radius;
      } else {
        const minX = Math.min(...all.map((p) => p.x)),
          maxX = Math.max(...all.map((p) => p.x));
        const minY = Math.min(...all.map((p) => p.y)),
          maxY = Math.max(...all.map((p) => p.y));
        cx = (minX + maxX) / 2;
        cy = (minY + maxY) / 2;
        scale = Math.min(440 / Math.max(50, maxX - minX), 300 / Math.max(50, maxY - minY));
      }
      return {
        scale,
        project(p) {
          const m = meters(p);
          return [300 + (m.x - cx) * scale, 240 + (m.y - cy) * scale];
        }
      };
    }
    function drawMap(frame, stale) {
      const camera = cameraFor(frame, following);
      const line = frame.polyline.map((p) => camera.project(p).join(",")).join(" ");
      const visible = ([x, y]) => x >= 45 && x <= 555 && y >= 70 && y <= 410;
      // Draw only the road geometry supplied by the phone. A quiet map canvas and
      // road casing replace the coordinate grid without inventing nearby streets.
      const background = loadedBasemap
        ? `<image href="/cast/basemap?v=${loadedBasemap.sequence}" width="600" height="480"/>`
        : "";
      let drawing = `<rect width="600" height="480" fill="#202722"/>${background}<g fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="${line}" stroke="#101712" stroke-width="${loadedBasemap ? 15 : 42}"/><polyline points="${line}" stroke="#627067" stroke-width="${loadedBasemap ? 13 : 36}"/><polyline points="${line}" stroke="#37453c" stroke-width="${loadedBasemap ? 11 : 32}"/><polyline points="${line}" stroke="#1b3021" stroke-width="${loadedBasemap ? 8 : 12}"/><polyline points="${line}" stroke="#caff75" stroke-width="${loadedBasemap ? 5 : 7}"/></g>`;
      for (const [index, turn] of (frame.turns || []).entries()) {
        const [x, y] = camera.project(turn);
        if (!visible([x, y])) continue;
        drawing += `<circle cx="${x}" cy="${y}" r="14" fill="#ffbe69" stroke="#0d171d" stroke-width="3"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="15" font-weight="700" fill="#080e12">${index + 1}</text>`;
      }
      const end = camera.project(frame.polyline[frame.polyline.length - 1]);
      if (visible(end))
        drawing += `<circle cx="${end[0]}" cy="${end[1]}" r="8" fill="#fff"/><text x="${end[0]}" y="${end[1] - 20}" text-anchor="middle" font-size="16" fill="#fff">终点</text>`;
      if (frame.position) {
        const [x, y] = camera.project(frame.position);
        if (loadedBasemap && !stale && Number.isFinite(latestState?.heading)) {
          drawing += `<path d="M 0 -34 L -10 -17 L 10 -17 Z" transform="translate(${x} ${y}) rotate(${latestState.heading})" fill="#63d8ff" stroke="#0d171d" stroke-width="2"/>`;
        }
        // An outlined amber marker is explicitly last-known, never live GPS.
        drawing += `<circle cx="${x}" cy="${y}" r="20" fill="#0d171d"/><circle cx="${x}" cy="${y}" r="12" fill="${stale ? "#0d171d" : "#63d8ff"}" stroke="${stale ? "#ffbe69" : "#e7faff"}" stroke-width="3"/><text x="${x}" y="${y + 40}" text-anchor="middle" font-size="15" fill="${stale ? "#ffbe69" : "#bacbd2"}">${stale ? "上次位置" : "当前位置"}</text>`;
      }
      el("map").innerHTML = drawing;
      const desired = 90 / camera.scale;
      const magnitude = 10 ** Math.floor(Math.log10(desired));
      const scaleMeters = [1, 2, 5, 10].map((n) => n * magnitude).find((n) => n >= desired) || magnitude * 10;
      // Convert SVG user units into CSS pixels (viewBox uses xMidYMid meet).
      const rect = el("map").getBoundingClientRect();
      const svgToPixel = Math.min(rect.width / 600, rect.height / 480);
      el("scale").style.width = `${Math.max(1, scaleMeters * camera.scale * svgToPixel)}px`;
      el("scale").textContent = distance(scaleMeters);
      el("camera").textContent = following ? "全程" : "跟随";
      el("camera").setAttribute("aria-pressed", String(following));
      el("map-note").textContent = `${following && frame.position ? "跟随位置" : "路线全程"} · 北向上`;
    }

    let musicPending = false;
    let musicFeedback = "";
    let musicFeedbackPlayer = null;
    function renderMusic(state) {
      const music = state.music;
      const player = music?.player;
      if (player?.id !== musicFeedbackPlayer) {
        musicFeedback = "";
        musicFeedbackPlayer = player?.id;
      }
      for (const prefix of ["idle", "nav"]) {
        const get = (part) => el(`${prefix}-music${part ? "-" + part : ""}`);
        get("").hidden = prefix === "nav" ? !state.frame || !player : !!state.frame || !music;
        get("source").textContent = player
          ? `${player.name} · 蓝牙 · ${player.status === "playing" ? "正在播放" : player.status === "paused" ? "已暂停" : "已停止"}`
          : "手机音乐 · 蓝牙";
        get("title").textContent = player ? player.title || "手机正在播放" : "连接手机播放音乐";
        get("artist").textContent = player
          ? [player.artist, player.album].filter(Boolean).join(" · ")
          : music?.message || "";
        get("controls").hidden = !player;
        const connection = music?.connection;
        get("connection-status").textContent = connection?.bonded
          ? `${connection.name} · ${connection.autoReconnect ? (connection.connecting ? "正在重连" : "自动连接已开启") : "自动连接已暂停"}`
          : "首次请在手机蓝牙设置中配对";
        get("connect").hidden = !connection?.bonded || connection.autoReconnect;
        get("disconnect").hidden = !connection?.bonded || !connection.autoReconnect;
        get("connect").disabled = musicPending;
        get("disconnect").disabled = musicPending;
        get("toggle").textContent = player?.status === "playing" ? "Ⅱ" : "▶";
        get("toggle").setAttribute("aria-label", player?.status === "playing" ? "暂停" : "播放");
        for (const action of ["previous", "toggle", "next"])
          get(action).disabled = !player || musicPending || music?.busy;
        const progress = get("progress");
        progress.hidden = !player || !(player.duration > 0) || player.position === null;
        progress.max = player?.duration || 1;
        progress.value = Math.min(player?.position || 0, progress.max);
        get("feedback").hidden = !musicFeedback;
        get("feedback").textContent = musicFeedback;
      }
    }
    async function controlMusic(action) {
      const player = latestState?.music?.player;
      const connectionAction = action === "connect" || action === "disconnect";
      if ((!player && !connectionAction) || musicPending || latestState?.music?.busy) return;
      musicPending = true;
      musicFeedback = "";
      musicFeedbackPlayer = player?.id;
      renderMusic(latestState);
      try {
        const response = await fetch("/cast/music", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-HUD-Control": "1" },
          body: JSON.stringify({ action, playerId: player?.id }),
          signal: AbortSignal.timeout(20000)
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.message || "音乐操作未完成");
      } catch (error) {
        musicFeedback = error.message || "音乐连接已断开";
      } finally {
        musicPending = false;
        if (latestState) renderMusic(latestState);
      }
    }
    for (const prefix of ["idle", "nav"]) {
      el(`${prefix}-music-connect`).onclick = () => controlMusic("connect");
      el(`${prefix}-music-disconnect`).onclick = () => controlMusic("disconnect");
      el(`${prefix}-music-previous`).onclick = () => controlMusic("previous");
      el(`${prefix}-music-next`).onclick = () => controlMusic("next");
      el(`${prefix}-music-toggle`).onclick = () =>
        controlMusic(latestState?.music?.player?.status === "playing" ? "pause" : "play");
    }

    function updateClock() {
      const now = new Date();
      const timeZone = latestState?.timeZone || Intl.DateTimeFormat().resolvedOptions().timeZone;
      el("idle-clock").textContent = now.toLocaleTimeString("zh-CN", {
        timeZone,
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
      el("idle-date").textContent = now.toLocaleDateString("zh-CN", {
        timeZone,
        month: "long",
        day: "numeric",
        weekday: "long"
      });
      el("idle-zone").textContent = `本地时间 · ${timeZone}`;
    }
    function renderIdle(state) {
      updateClock();
      el("idle-message").textContent = state.connected ? "手机已连接 · 等待导航路线" : "随时出发 · 在手机上开始导航";
      el("idle-ready").textContent = state.connected ? "● 手机已连接" : "● HUD 已就绪";
      el("pairing-note").textContent = state.connected ? "等待手机导航" : "同一 Wi-Fi · 5 分钟有效";
      const weather = state.weather;
      el("weather-city").textContent = weather?.city || "当地天气";
      el("weather-temperature").textContent = weather ? `${weather.temperature}°` : "—";
      el("weather-condition").textContent = weather ? weather.condition : "天气暂不可用";
      el("weather-icon").textContent = !weather
        ? "☁"
        : /雪/.test(weather.condition)
          ? "❄"
          : /雨/.test(weather.condition)
            ? "☂"
            : /晴/.test(weather.condition)
              ? "☀"
              : "☁";
      el("weather-detail").textContent = weather
        ? `${weather.wind} · 湿度 ${weather.humidity}%`
        : "联网后自动更新 · 高德天气";
      el("weather-updated").textContent = weather
        ? `${weather.stale ? "旧数据 · " : ""}${weather.reportTime} 发布 · ${weather.source === "navigation" ? "最近导航城市" : "网络所在地"}`
        : "";
    }
    function clockTick() {
      updateClock();
      setTimeout(clockTick, 1000);
    }
    clockTick();
    function render(state) {
      latestState = state;
      renderIdle(state);
      renderMusic(state);
      loadBasemap(state);
      document.body.classList.toggle("street-map", !!loadedBasemap);
      const hasPhoneMap = !!state.frame && !state.stale && !!state.mapSequence && !loadedBasemap;
      if (hasPhoneMap && mapImageSequence !== state.mapSequence) {
        mapImageSequence = state.mapSequence;
        el("phone-map").src = `/cast/map?v=${state.mapSequence}`;
      }
      if (!hasPhoneMap) {
        mapImageLoaded = false;
        mapImageSequence = null;
      }
      const showPhoneMap = hasPhoneMap && mapImageLoaded;
      el("phone-map").hidden = !showPhoneMap;
      el("map").hidden = showPhoneMap;
      el("camera").hidden = showPhoneMap || !!loadedBasemap;
      el("compass").hidden = showPhoneMap;
      el("scale").hidden = showPhoneMap;
      const frame = state.frame;
      el("join").hidden = !!frame;
      el("guidance").hidden = !frame;
      el("map-panel").hidden = !frame;
      document.body.classList.toggle("stale", state.stale && state.connected);
      el("status").textContent = !state.connected
        ? "等待手机连接"
        : state.stale
          ? "位置更新中 · 请查看手机"
          : "手机导航已连接";
      el("address").textContent = state.addresses.map((address) => `${address}:${state.port}`).join(" / ");
      el("code").textContent = state.code || "已连接";
      if (!frame) {
        arrivalAt = null;
        lastArrivalSequence = null;
        return;
      }
      el("destination").textContent = `前往 ${frame.destination}`;
      el("distance").textContent = state.stale
        ? "等待更新"
        : frame.offRoute
          ? "重新规划中"
          : `${distance(frame.distance)} 后`;
      el("arrow").textContent = state.stale || frame.offRoute ? "·" : arrow(frame.instruction);
      el("instruction").textContent = state.stale ? "请查看手机导航" : frame.instruction;
      el("remaining").textContent = distance(frame.remaining);
      el("duration").textContent = `${Math.max(1, Math.ceil(frame.seconds / 60))} 分钟`;
      // Anchor ETA to a new phone frame, not every browser poll or stale interval.
      if (!state.stale && frame.sequence !== lastArrivalSequence) {
        arrivalAt = Date.now() + frame.seconds * 1000;
        lastArrivalSequence = frame.sequence;
      }
      el("arrival").textContent =
        state.stale || arrivalAt === null
          ? "—"
          : new Date(arrivalAt).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
      const turns = (frame.turns || []).slice(1);
      el("upcoming-panel").hidden = !turns.length || state.stale || frame.offRoute;
      el("upcoming").replaceChildren();
      for (const [index, turn] of turns.entries()) {
        const item = document.createElement("li");
        const number = document.createElement("span");
        number.className = "turn-number";
        number.textContent = String(index + 2);
        const copy = document.createElement("div");
        copy.className = "turn-copy";
        const instruction = document.createElement("span");
        instruction.textContent = `${arrow(turn.instruction)} ${turn.instruction}`;
        const meters = document.createElement("small");
        meters.textContent = `${distance(turn.distance)} 后`;
        copy.append(instruction, meters);
        item.append(number, copy);
        el("upcoming").append(item);
      }
      drawMap(frame, state.stale);
      if (showPhoneMap) el("map-note").textContent = "HUD 独立地图 · 跟随位置";
      if (loadedBasemap) el("map-note").textContent = state.stale ? "街道地图 · 等待位置更新" : "实时街道 · 北向上";
    }
    window.addEventListener("resize", () => {
      if (latestState) render(latestState);
    });
    async function poll() {
      try {
        const response = await fetch("/cast/state", { cache: "no-store", signal: AbortSignal.timeout(3000) });
        if (!response.ok) throw new Error("Disconnected");
        render(await response.json());
      } catch {
        document.body.classList.add("stale");
        el("status").textContent = "RDK 显示服务已断开";
        el("guidance").hidden = true;
        el("map-panel").hidden = true;
        el("join").hidden = true;
      }
      setTimeout(poll, 500);
    }
    if (typeof EventSource !== "undefined") {
      const events = new EventSource("/cast/events");
      events.onmessage = (event) => {
        try {
          render(JSON.parse(event.data));
        } catch {
          /* polling retries */
        }
      };
    }
    poll();
  </script>
</html>
