# Installed to /etc/systemd/system/max-vision.service.d/. See the "Service
# inventory" in rdk/README.md for why each line is here and, as important, why
# the obvious ones are missing.
#
# Deliberately NOT here: User=, DeviceAllow=, CapabilityBoundingSet=,
# ProtectKernelTunables=, ProtectSystem=strict. The sidecar drives the camera
# through the vendor's ROS node and BPU libraries, which open device nodes and
# may write /sys or paths that have never been enumerated on this board. Making
# any of them read-only or unreachable can leave the helmet camera-less (the
# sidecar refuses to run without cameras). See "Next step" in the README.
[Service]
NoNewPrivileges=true
# rclpy and mipi_cam are both children of this one service, so they share the
# private /tmp (and FastDDS lock files, if any, live under /dev/shm, which this
# does not touch).
PrivateTmp=true
# /root stays readable because the unit points HOME there for ROS; it just
# cannot be written. If a vendor library writes under ~/.ros the camera will
# not open: that is what the acceptance checklist's camera step catches.
ProtectHome=read-only
# /usr, /boot and /etc read-only. The sidecar writes only /var/lib/max
# (gallery, corpus, shadow logs) and /run/max (socket, ROS logs); neither is
# covered by this setting, so no ReadWritePaths= is needed.
ProtectSystem=full
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
# A ceiling, not a budget; see max-agent.service.d/hardening.conf.
MemoryMax=75%
