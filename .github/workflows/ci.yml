name: Cross-platform CI

# Pull requests run once (not once for the push and again for the pull request).
# To run the checks on a branch that has no pull request, start the workflow by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs every job here before it drafts a release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=low

  # The web SDK as a page embeds it, in Chromium, Firefox and WebKit: the README's quick start
  # (relay on the demo backend, example shop, one script tag), with a fake microphone.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # Firefox on Linux needs a sound server: without one its AudioContext stays suspended and no microphone
      # audio reaches the relay. A null sink is enough.
      - name: Start PulseAudio with a null sink
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=null
          pactl set-default-sink null
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  rdk-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: rdk/vision/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python -m pip install -r rdk/vision/requirements-dev.txt
      - run: npm run test:rdk-vision

  speech-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: speech-server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: speech-server/uv.lock
      - run: uv sync --frozen
      # Model-free by default: tests marked `models` skip unless MAX_SPEECH_MODEL_TESTS=1.
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  speech-server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # CPU target only. The cuda target is about 4 GB and cannot be run without a GPU, so CI does not build it.
      - uses: docker/build-push-action@v7
        with:
          context: speech-server
          target: cpu
          push: false
          load: true
          tags: max-speech:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Entrypoint refuses to start without SPEECH_API_KEY
        run: |
          set +e
          docker run --rm max-speech:ci
          code=$?
          echo "exit code: $code"
          test "$code" -eq 64

  # The production relay image: builds from the root Dockerfile and must come up healthy, as the non-root user,
  # serving the SDK, with its data volume writable (/ready checks the stores under /data).
  relay-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: max-relay:ci
          cache-from: type=gha,scope=relay
          cache-to: type=gha,scope=relay,mode=max
      - name: The image starts healthy and ready
        run: |
          docker run -d --name relay -p 8787:8787 -e RELAY_AUTH_TOKEN=ci-relay-secret max-relay:ci
          # As long as the Dockerfile's health policy allows (20 s start period, then up to three checks 30 s apart),
          # stopping early once Docker has called it unhealthy or the container has exited.
          status=starting
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' relay 2>/dev/null || echo exited)
            case $status in healthy | unhealthy | exited) break ;; esac
            [ "$(docker inspect -f '{{.State.Running}}' relay)" = true ] || { status=exited; break; }
            sleep 2
          done
          docker logs relay | tail -20
          echo "health: $status"
          test "$status" = healthy
          curl --fail --silent http://localhost:8787/ready
          curl --fail --silent --output /dev/null http://localhost:8787/sdk/voice-agent.iife.js
          test "$(docker exec relay id -un)" = node

  # The Python reference client in examples/device-client, against a scripted relay.
  device-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install 'websockets>=10'
      - run: python -m unittest discover -s examples/device-client -p 'test_*.py' -v

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          # Install only what is needed (v4 defaults to platform-tools). Match AGP's SDK selection.
          packages: "platform-tools platforms;android-36.1 build-tools;36.0.0"
      # MainLaunchTest's Robolectric runtime (about 200 MB) is fetched into ~/.m2, which `cache: gradle` leaves out.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/gradle/libs.versions.toml') }}
      - run: chmod +x android/gradlew
      - run: android/gradlew -p android test lint
      # Unsigned: proves the release variant still builds and packages.
      - run: android/gradlew -p android assembleRelease -PversionCode=${{ github.run_number }}

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
          working-directory: ios
      - name: Install iOS dependencies
        working-directory: ios
        run: bundle exec pod install --deployment
      - name: Select a simulator
        id: simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            phone = devices.find { |device| device["name"].start_with?("iPhone") && device["isAvailable"] }
            abort "No available iPhone simulator" unless phone
            puts phone.fetch("udid")
          ')
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild \
            -workspace ios/MaxHelmet.xcworkspace \
            -scheme MaxHelmet \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            MAX_GIT_COMMIT="${GITHUB_SHA::12}" \
            MAX_BUILD_NUMBER="${{ github.run_number }}" \
            test
