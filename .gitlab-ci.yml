# Runs on the OrbStack ci-runner VM (shell executor, Ubuntu 22.04 arm64):
# Node 22, Python 3.10, and ffmpeg are installed on the runner host.

stages:
  - test

web:check:
  stage: test
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run check

rdk:vision-gate:
  stage: test
  cache:
    key:
      files:
        - rdk/vision/requirements-dev.txt
    paths:
      - .venv/
  script:
    - python3.10 -m venv .venv
    - .venv/bin/python -m pip install --quiet --upgrade pip
    - .venv/bin/python -m pip install --quiet -r rdk/vision/requirements-dev.txt
    - PATH="$PWD/.venv/bin:$PATH" npm run test:rdk-vision
