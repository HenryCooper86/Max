# Installed to /etc/systemd/system/max-agent.service.d/. Sandboxing for a
# service that runs as root on a worn device. Each line is justified by the
# "Service inventory" in rdk/README.md; remove the whole drop-in with the
# one-command rollback in the "On-board acceptance checklist".
#
# Deliberately NOT here: User=, DeviceAllow=, CapabilityBoundingSet=,
# RestrictAddressFamilies=, MemoryDenyWriteExecute=. Each could remove access
# the agent needs (ALSA nodes, D-Bus to bluez, `shutdown`, V8's JIT) and none
# can be proven safe without the board. See "Next step" in the README.
[Service]
NoNewPrivileges=true
PrivateTmp=true
ProtectHome=true
# The agent writes only /var/lib/max (device id, HUD bonds), which
# StateDirectory= already makes writable; the path is repeated so the intent
# survives someone removing StateDirectory. MAX_AEC_DUMP is a debugging aid
# that writes elsewhere: add its directory to ReadWritePaths= to use it.
ProtectSystem=strict
ReadWritePaths=-/var/lib/max
ProtectKernelTunables=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
# A ceiling, not a budget: the agent has no measured footprint, so this only
# stops a runaway from taking the whole board (and the vision sidecar) down
# with it. Percentages need cgroup v2; an unsupported kernel ignores the line.
MemoryMax=75%
