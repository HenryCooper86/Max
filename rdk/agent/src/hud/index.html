<!doctype html>
<meta charset="utf-8" />
<title>Max · RDK X5 bench</title>
<style>
  body {
    margin: 0;
    background: #0b0d10;
    color: #e6edf3;
    font:
      14px/1.5 ui-monospace,
      monospace;
    padding: 16px;
  }
  h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7d8590;
  }
  .row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card {
    background: #12161b;
    border: 1px solid #21262d;
    border-radius: 8px;
    padding: 12px;
    flex: 1 1 320px;
  }
  img {
    width: 100%;
    border-radius: 6px;
    background: #000;
  }
  .rider {
    color: #7ee787;
  }
  .agent {
    color: #79c0ff;
  }
  .partial {
    opacity: 0.6;
  }
  dt {
    color: #7d8590;
    float: left;
    width: 96px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .tile {
    border: 1px solid #21262d;
    border-radius: 6px;
    overflow: hidden;
    background: #0b0d10;
  }
  .tile img {
    display: block;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    cursor: pointer;
  }
  .tile .meta {
    padding: 6px 8px;
    font-size: 12px;
    color: #7d8590;
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 6px;
  }
  .muted {
    color: #7d8590;
  }
  #companion-card {
    margin-bottom: 16px;
    overflow-wrap: anywhere;
  }
  #navigation-card {
    margin-bottom: 16px;
    border-left: 4px solid #79c0ff;
    overflow-wrap: anywhere;
  }
  #navigation-card.paused,
  #navigation-card.off-route,
  #navigation-card.rerouting {
    border-left-color: #d29922;
  }
  #navigation-card.paused #nav-distance,
  #navigation-card.off-route #nav-distance,
  #navigation-card.rerouting #nav-distance {
    color: #d29922;
  }
  #navigation-card.paused #nav-instruction {
    opacity: 0.72;
  }
  #nav-instruction {
    margin-top: 4px;
    font-family: system-ui, sans-serif;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 700;
    line-height: 1.2;
  }
  #nav-distance {
    color: #79c0ff;
    font-family: system-ui, sans-serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 800;
    line-height: 1.15;
  }
  #nav-summary {
    margin-top: 6px;
  }
  .warning {
    margin-top: 8px;
    color: #d29922;
    font-weight: 700;
  }
  .missing {
    padding: 24px 8px;
    text-align: center;
    color: #f85149;
    font-size: 12px;
  }
  .recording {
    padding: 24px 8px;
    text-align: center;
    color: #d29922;
    font-size: 12px;
  }
  .tile.live {
    border-color: #d29922;
  }
  button {
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 4px;
    color: #e6edf3;
    font: inherit;
    font-size: 12px;
    padding: 2px 8px;
    cursor: pointer;
  }
  button:hover {
    border-color: #7d8590;
  }
  button.danger:hover {
    border-color: #f85149;
    color: #f85149;
  }
  button.on {
    border-color: #79c0ff;
    color: #79c0ff;
  }
  button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .del {
    padding: 0 6px;
    line-height: 18px;
  }
  #viewer {
    position: fixed;
    inset: 0;
    background: rgba(4, 6, 8, 0.92);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
    z-index: 10;
  }
  #viewer[hidden] {
    display: none;
  }
  #viewer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  #viewer-title {
    color: #7d8590;
    font-size: 13px;
  }
  #viewer-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  #viewer-panels {
    flex: 1;
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    min-height: 0;
    overflow: auto;
  }
  #viewer-panels figure {
    margin: 0;
    max-width: min(860px, 96vw);
    flex: 1 1 380px;
  }
  #viewer-panels img {
    width: 100%;
    max-height: 74vh;
    object-fit: contain;
  }
  #viewer-panels figcaption {
    font-size: 12px;
    color: #7d8590;
    padding-top: 4px;
    text-align: center;
  }
  #viewer-panels a {
    color: #79c0ff;
  }
</style>
<h1>Max · RDK X5 bench</h1>
<section id="companion-card" class="card">
  <div id="discovery-status" class="muted"></div>
  <div id="phone-status" class="muted"></div>
</section>
<section id="navigation-card" class="card nav" hidden>
  <div id="nav-instruction"></div>
  <div id="nav-distance"></div>
  <div id="nav-summary" class="muted"></div>
  <div id="nav-paused" class="warning" hidden>手机定位已断开 · 导航暂停</div>
</section>
<div class="row">
  <div class="card">
    <dl>
      <dt>connection</dt>
      <dd id="connection">–</dd>
      <dt>turn</dt>
      <dd id="turn">–</dd>
      <dt>latency</dt>
      <dd id="latency">–</dd>
      <dt>error</dt>
      <dd id="error">–</dd>
    </dl>
  </div>
  <div class="card"><img id="front" alt="front camera" /></div>
  <div class="card"><img id="rear" alt="rear camera" /></div>
</div>
<div class="card" style="margin-top: 16px"><div id="transcript"></div></div>
<div class="card" style="margin-top: 16px">
  <h1 style="margin-top: 0">captures</h1>
  <div id="captures-status" class="muted">loading…</div>
  <div id="captures" class="grid"></div>
</div>
<div id="viewer" hidden>
  <div id="viewer-bar">
    <span id="viewer-title"></span>
    <span id="viewer-actions"></span>
  </div>
  <div id="viewer-panels"></div>
</div>
<script>
  const host = location.hostname;

  // The sidecar serves on its own port and refuses any peer that is not the
  // board itself without this token (bench_server.authorized). The agent
  // templates it in, so opening this page is what authorises the browser —
  // there is nothing to type. Empty when the board has no MAX_VISION_TOKEN
  // set, in which case only a browser running on the board can reach 8081.
  const VISION_TOKEN = "__VISION_TOKEN__";

  function sidecar(path, params = {}) {
    const url = new URL(`http://${host}:__PREVIEW_PORT__${path}`);
    if (VISION_TOKEN) url.searchParams.set("t", VISION_TOKEN);
    for (const [key, value] of Object.entries(params)) url.searchParams.set(key, value);
    return url.toString();
  }

  document.getElementById("front").src = sidecar("/preview/front");
  document.getElementById("rear").src = sidecar("/preview/rear");

  // The token rides here too. `location.host` is host:port with no query, so
  // this URL does not inherit the ?t= that loaded the page — and the upgrade is
  // gated exactly like the page is. Missed once: the cameras and gallery kept
  // working (they go through sidecar()) while connection/turn/latency/error sat
  // at "—", because this one socket was being refused 401 on its own.
  const socket = new WebSocket(`ws://${location.host}/${VISION_TOKEN ? `?t=${encodeURIComponent(VISION_TOKEN)}` : ""}`);
  const navigationCardEl = document.getElementById("navigation-card");
  const discoveryStatusEl = document.getElementById("discovery-status");
  const phoneStatusEl = document.getElementById("phone-status");
  const navInstructionEl = document.getElementById("nav-instruction");
  const navDistanceEl = document.getElementById("nav-distance");
  const navSummaryEl = document.getElementById("nav-summary");
  const navPausedEl = document.getElementById("nav-paused");
  let pairingExpiryTimer;
  let latestHudState;

  const finiteNonNegative = (value) => typeof value === "number" && Number.isFinite(value) && value >= 0;
  const formatDistance = (meters) => {
    if (!finiteNonNegative(meters)) return "";
    return Math.round(meters) < 1000 ? `${Math.round(meters)} m` : `${(meters / 1000).toFixed(1)} km`;
  };
  const formatEta = (seconds) => {
    if (!finiteNonNegative(seconds)) return "";
    const minutes = Math.max(1, Math.ceil(seconds / 60));
    if (seconds < 3600) return `${minutes} 分钟`;
    const hours = Math.floor(minutes / 60);
    const remainder = minutes % 60;
    return `${hours} 小时${remainder === 0 ? "" : ` ${remainder} 分钟`}`;
  };
  const hasVisiblePairing = (companion, now) =>
    !companion.paired &&
    typeof companion.pairingCode === "string" &&
    companion.pairingCode.length > 0 &&
    finiteNonNegative(companion.pairingExpiresAt) &&
    companion.pairingExpiresAt > now;
  const phoneStatus = (companion, now) => {
    if (hasVisiblePairing(companion, now)) {
      const minutes = Math.max(1, Math.ceil((companion.pairingExpiresAt - now) / 60000));
      return `配对码 ${companion.pairingCode} · ${minutes} 分钟内有效`;
    }
    const labels = {
      connected: "手机 GPS 已连接",
      sharing: "手机 GPS 共享中",
      stopped: "手机 GPS 已停止",
      stale: "手机 GPS 信号过期",
      // The board reports `unpaired` until the phone streams its first fix, so
      // a paired helmet sits here between pairing and Helmet Ride. Saying
      // 手机未配对 there reads as a broken binding; it is not.
      unpaired: companion.paired ? "手机已配对 · 未共享定位" : "手机未配对"
    };
    const parts = [labels[companion.locationState] ?? "手机 GPS 状态未知"];
    if (finiteNonNegative(companion.horizontalAccuracyMeters)) {
      parts.push(`精度 ±${Math.round(companion.horizontalAccuracyMeters)} m`);
    }
    if (finiteNonNegative(companion.lastFixAgeMs)) {
      parts.push(`${Math.max(0, Math.round(companion.lastFixAgeMs / 1000))} 秒前`);
    }
    return parts.join(" · ");
  };
  // Only the navigation half. The companion status card is never hidden: a
  // paired, idle board must still show whether it is broadcasting and whether
  // the phone is sharing location.
  const clearNavigation = () => {
    navigationCardEl.hidden = true;
    navigationCardEl.classList.toggle("paused", false);
    navigationCardEl.classList.toggle("rerouting", false);
    navigationCardEl.classList.toggle("off-route", false);
    navInstructionEl.textContent = "";
    navDistanceEl.textContent = "";
    navSummaryEl.textContent = "";
    navPausedEl.hidden = true;
  };
  const clearPairingExpiry = () => {
    if (pairingExpiryTimer === undefined) return;
    clearTimeout(pairingExpiryTimer);
    pairingExpiryTimer = undefined;
  };
  const renderNavigation = (state) => {
    latestHudState = state;
    clearPairingExpiry();
    const renderedAt = Date.now();
    const navigation = state.navigation !== null && typeof state.navigation === "object" ? state.navigation : null;
    const pairingVisible = hasVisiblePairing(state.companion, renderedAt);
    // Companion status renders on every frame, route or no route.
    discoveryStatusEl.textContent = `配对广播 ${state.discovery}`;
    phoneStatusEl.textContent = phoneStatus(state.companion, renderedAt);
    if (pairingVisible) {
      // Re-render exactly when the code expires so the row falls back to live
      // status without waiting for another socket frame.
      pairingExpiryTimer = setTimeout(
        () => {
          pairingExpiryTimer = undefined;
          if (latestHudState !== undefined) renderNavigation(latestHudState);
        },
        Math.max(0, state.companion.pairingExpiresAt - renderedAt)
      );
    }
    if (navigation === null) {
      clearNavigation();
      return;
    }
    const paused = navigation.phase === "paused";
    const rerouting = navigation.phase === "rerouting";
    const offRoute = navigation.offRoute === true;
    navigationCardEl.hidden = false;
    navigationCardEl.classList.toggle("paused", paused);
    navigationCardEl.classList.toggle("rerouting", rerouting);
    navigationCardEl.classList.toggle("off-route", offRoute);
    navInstructionEl.textContent =
      typeof navigation.instruction === "string"
        ? navigation.instruction
        : navigation.phase === "starting"
          ? "正在规划路线…"
          : "";
    navDistanceEl.textContent = formatDistance(navigation.distanceToManeuverMeters);
    const summary = [];
    if (offRoute && rerouting) summary.push("偏离路线 · 正在重新规划");
    else if (offRoute) summary.push("已偏离路线");
    else if (rerouting) summary.push("正在重新规划");
    if (typeof navigation.destinationName === "string" && navigation.destinationName.length > 0) {
      summary.push(navigation.destinationName);
    }
    const remaining = formatDistance(navigation.remainingMeters);
    if (remaining) summary.push(`剩余 ${remaining}`);
    const eta = formatEta(navigation.remainingSeconds);
    if (eta) summary.push(`预计 ${eta}`);
    navSummaryEl.textContent = summary.join(" · ");
    navPausedEl.textContent = "手机定位已断开 · 导航暂停";
    navPausedEl.hidden = !paused;
  };

  socket.onmessage = (message) => {
    const state = JSON.parse(message.data);
    document.getElementById("connection").textContent = state.connection;
    document.getElementById("turn").textContent = state.turnState;
    document.getElementById("latency").textContent = state.latencyMs === null ? "–" : `${state.latencyMs} ms`;
    document.getElementById("error").textContent = state.lastError ?? "–";
    renderNavigation(state);
    document.getElementById("transcript").innerHTML = state.transcript
      .map((turn) => `<div class="${turn.speaker} ${turn.final ? "" : "partial"}">${turn.speaker}: ${turn.text}</div>`)
      .join("");
  };

  const capturesEl = document.getElementById("captures");
  const statusEl = document.getElementById("captures-status");
  const viewerEl = document.getElementById("viewer");
  const panelsEl = document.getElementById("viewer-panels");
  const titleEl = document.getElementById("viewer-title");
  const actionsEl = document.getElementById("viewer-actions");
  let pairs = [];
  let lastSerialised = null;
  let viewerIndex = -1;
  // Playback speed multiplier. The sidecar paces each clip at the rate its
  // writer actually achieved (the manifest's fps); 1× means real time.
  let viewerSpeed = 1;
  // Bumped on every stream URL so reopening a clip replays it instead of
  // showing the browser's cached last frame.
  let streamNonce = 0;

  const sidesOf = (pair) => ["front", "rear"].filter((s) => pair[s] && pair.sizes && pair.sizes[s] !== null);
  const fmtSize = (bytes) =>
    bytes >= 1048576 ? `${(bytes / 1048576).toFixed(1)} MB` : `${Math.round(bytes / 1024)} KB`;
  const fmtDur = (seconds) => {
    // Round before splitting, or 119.7 s reads "1 m 60 s".
    const whole = Math.round(seconds);
    return whole >= 60 ? `${Math.floor(whole / 60)} m ${String(whole % 60).padStart(2, "0")} s` : `${whole} s`;
  };
  const fmtWhen = (pair) => (pair.created ? pair.created.slice(5, 16).replace("T", " ") : pair.id);
  const gb = (mb) => `${(mb / 1024).toFixed(1)} GB`;

  function tile(pair, index) {
    const side = sidesOf(pair)[0];
    const isVideo = pair.kind === "video";
    const label = pair.recording ? "video · recording" : isVideo ? "video" : "photo";
    const dur = pair.duration_s ? ` · ${fmtDur(pair.duration_s)}` : "";
    // A live recording cannot be deleted (the sidecar refuses with 409), so
    // its tile does not offer to.
    const del = pair.recording ? "" : `<button class="del danger" data-del="${index}" title="delete">✕</button>`;

    if (!side) {
      const missing = pair.recording ? "recording…" : "file missing";
      const size = "waiting for the first frame";
      return `<div class="tile ${pair.recording ? "live" : ""}"><div class="${pair.recording ? "recording" : "missing"}">${missing}</div>
        <div class="meta"><span>${fmtWhen(pair)} · ${label} · ${size}</span>${del}</div></div>`;
    }
    const href = sidecar(`/gallery/${pair.id}/${pair[side]}`);
    const src = isVideo ? sidecar(`/gallery/${pair.id}/${pair[side]}/thumb`) : href;
    const size = fmtSize(pair.sizes[side]);
    return `<div class="tile ${pair.recording ? "live" : ""}">
      <img src="${src}" alt="${pair.id}" data-view="${index}" loading="lazy" />
      <div class="meta"><span>${fmtWhen(pair)} · ${label}${dur} · ${size}${pair.degraded ? " · degraded" : ""}</span>${del}</div></div>`;
  }

  function renderViewer() {
    const pair = pairs[viewerIndex];
    if (!pair) {
      closeViewer();
      return;
    }
    const isVideo = pair.kind === "video";
    const dur = pair.duration_s ? ` · ${fmtDur(pair.duration_s)}` : "";
    titleEl.textContent = `${pair.id} · ${pair.kind}${dur}${pair.recording ? " · still recording" : ""}`;

    panelsEl.innerHTML = sidesOf(pair)
      .map((side) => {
        const href = sidecar(`/gallery/${pair.id}/${pair[side]}`);
        // `n` is the cache-buster that forces a fresh stream on replay; `t` is
        // the bench token and must not be overwritten by it.
        const src = isVideo
          ? sidecar(`/gallery/${pair.id}/${pair[side]}/play`, { speed: viewerSpeed, n: ++streamNonce })
          : href;
        return `<figure><img src="${src}" alt="${pair.id} ${side}" />
          <figcaption>${side} · ${fmtSize(pair.sizes[side])} · <a href="${href}" download>download</a></figcaption></figure>`;
      })
      .join("");

    const speeds = isVideo
      ? [0.5, 1, 2]
          .map(
            (speed) => `<button data-speed="${speed}" class="${speed === viewerSpeed ? "on" : ""}">${speed}×</button>`
          )
          .join("")
      : "";
    const del = pair.recording ? "" : `<button id="viewer-delete" class="danger">delete</button>`;
    actionsEl.innerHTML = `${speeds}
      <button id="viewer-prev" ${viewerIndex >= pairs.length - 1 ? "disabled" : ""}>‹ older</button>
      <button id="viewer-next" ${viewerIndex <= 0 ? "disabled" : ""}>newer ›</button>
      ${del}<button id="viewer-close">✕</button>`;
  }

  function openViewer(index) {
    viewerIndex = index;
    viewerSpeed = 1;
    renderViewer();
    viewerEl.hidden = false;
  }

  function closeViewer() {
    viewerEl.hidden = true;
    // Dropping the <img> is what ends its /play stream on the sidecar.
    panelsEl.innerHTML = "";
    viewerIndex = -1;
  }

  async function deletePair(pair) {
    if (!confirm(`Delete ${pair.id} from the board? There is no undo.`)) return;
    let response;
    try {
      response = await fetch(sidecar(`/gallery/${pair.id}/delete`), { method: "POST" });
    } catch {
      alert("sidecar unreachable");
      return;
    }
    if (!response.ok) {
      let detail = "";
      try {
        detail = (await response.json()).error ?? "";
      } catch {}
      alert(`delete failed (${response.status})${detail ? `: ${detail}` : ""}`);
      return;
    }
    if (viewerIndex !== -1) closeViewer();
    lastSerialised = null;
    refreshCaptures();
  }

  capturesEl.addEventListener("click", (event) => {
    const view = event.target.closest("[data-view]");
    if (view) {
      openViewer(Number(view.dataset.view));
      return;
    }
    const del = event.target.closest("[data-del]");
    if (del && pairs[Number(del.dataset.del)]) deletePair(pairs[Number(del.dataset.del)]);
  });

  actionsEl.addEventListener("click", (event) => {
    const speed = event.target.closest("[data-speed]");
    if (speed) {
      viewerSpeed = Number(speed.dataset.speed);
      renderViewer();
      return;
    }
    if (event.target.id === "viewer-close") closeViewer();
    if (event.target.id === "viewer-prev" && viewerIndex < pairs.length - 1) openViewer(viewerIndex + 1);
    if (event.target.id === "viewer-next" && viewerIndex > 0) openViewer(viewerIndex - 1);
    if (event.target.id === "viewer-delete" && pairs[viewerIndex]) deletePair(pairs[viewerIndex]);
  });

  viewerEl.addEventListener("click", (event) => {
    if (event.target === viewerEl || event.target === panelsEl) closeViewer();
  });

  document.addEventListener("keydown", (event) => {
    if (viewerEl.hidden) return;
    if (event.key === "Escape") closeViewer();
    if (event.key === "ArrowLeft" && viewerIndex < pairs.length - 1) openViewer(viewerIndex + 1);
    if (event.key === "ArrowRight" && viewerIndex > 0) openViewer(viewerIndex - 1);
  });

  async function refreshCaptures() {
    let payload;
    try {
      const response = await fetch(sidecar("/gallery"), { cache: "no-store" });
      payload = await response.json();
    } catch {
      // "Cannot reach the sidecar" and "nothing captured yet" must never look
      // the same. A blank panel that meant both cost an afternoon once.
      statusEl.textContent = "sidecar unreachable";
      return;
    }

    pairs = payload.pairs;
    // The disk line updates every poll; the grid only re-renders on change,
    // so the tiles (and any open /play stream) are not churned by a byte
    // count ticking over.
    const disk = payload.disk ? ` · ${gb(payload.disk.free_mb)} free (floor ${gb(payload.disk.min_free_mb)})` : "";
    const count = pairs.length ? `${pairs.length} capture${pairs.length === 1 ? "" : "s"}` : "no captures yet";
    statusEl.textContent = count + disk;

    const serialised = JSON.stringify(payload.pairs);
    if (serialised === lastSerialised) return;
    lastSerialised = serialised;
    capturesEl.innerHTML = pairs.map(tile).join("");
  }

  refreshCaptures();
  setInterval(refreshCaptures, 3000);
</script>
