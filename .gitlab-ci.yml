# All jobs run on the OrbStack ci-runner VM (shell executor, Ubuntu 22.04
# arm64): Node 22, Python 3.10, ffmpeg, JDK 17, the Android SDK, and the
# AEC build deps are installed on the runner host. iOS is deliberately not
# in CI: xcodebuild requires macOS, and this project runs Linux-only runners.
#
# GitHub Actions (.github/workflows/ci.yml) is the full gate. These jobs are
# the ones this runner can do; it has no browsers, no Docker and no uv, so the
# browser tests, the speech server and the two container images run only there.
# Only GitLab builds the AEC binary.

stages:
  - test

web:check:
  stage: test
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run check
    - npm audit --omit=dev --audit-level=low

rdk:vision-gate:
  stage: test
  cache:
    key:
      files:
        - rdk/vision/requirements-dev.txt
    paths:
      - .venv/
  script:
    - python3.10 -m venv .venv
    - .venv/bin/python -m pip install --quiet --upgrade pip
    - .venv/bin/python -m pip install --quiet -r rdk/vision/requirements-dev.txt
    - PATH="$PWD/.venv/bin:$PATH" npm run test:rdk-vision

# Same aarch64 as the X5 board, so this binary is board-deployable.
rdk:aec-build:
  stage: test
  script:
    - make -C rdk/aec
  artifacts:
    paths:
      - rdk/aec/max-aec
    expire_in: 1 week

# The Python reference client in examples/device-client, against a scripted relay.
device-client:
  stage: test
  script:
    - python3.10 -m venv .venv-device
    - .venv-device/bin/python -m pip install --quiet 'websockets>=10'
    - .venv-device/bin/python -m unittest discover -s examples/device-client -p 'test_*.py' -v

# aapt2 is x86_64-only; the runner VM has amd64 multiarch libs so it runs
# under Rosetta. The SDK licenses/platform live in the runner's ANDROID_HOME.
android:build:
  stage: test
  script:
    - cd android
    - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-arm64
      ANDROID_HOME=/home/gitlab-runner/android-sdk
      ./gradlew --no-daemon testDebugUnitTest assembleDebug compileReleaseKotlin
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week
