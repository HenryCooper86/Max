name: Cross-platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=low

  rdk-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: rdk/vision/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python -m pip install -r rdk/vision/requirements-dev.txt
      - run: npm run test:rdk-vision

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x android/gradlew
      - run: android/gradlew -p android test lint

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
          working-directory: ios
      - name: Install iOS dependencies
        working-directory: ios
        run: bundle exec pod install --deployment
      - name: Select a simulator
        id: simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            phone = devices.find { |device| device["name"].start_with?("iPhone") && device["isAvailable"] }
            abort "No available iPhone simulator" unless phone
            puts phone.fetch("udid")
          ')
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild \
            -workspace ios/MaxHelmet.xcworkspace \
            -scheme MaxHelmet \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            HORIZON_GIT_COMMIT="${GITHUB_SHA::12}" \
            test
