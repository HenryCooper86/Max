# Weekly dependency updates, grouped so each ecosystem opens one pull request
# for minor and patch versions. Major versions arrive on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: bundler
    directory: /ios
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /speech-server
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /rdk/vision
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ["/", "/speech-server"]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
