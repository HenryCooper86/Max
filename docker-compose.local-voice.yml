# A fully local voice stack for VOICE_PROVIDER=local: open-weight models on
# your own machine, no cloud account and no API key.
#
#   docker compose -f docker-compose.local-voice.yml up -d
#   docker compose -f docker-compose.local-voice.yml exec ollama ollama pull qwen2.5:7b
#
# then in .env:  VOICE_PROVIDER=local   LOCAL_VOICE=on
#
# These are the CPU images, which run anywhere. For a GPU, switch each service
# to its project's GPU image and add the device reservation its README shows.
# Image tags move: if a pull fails, check the project's current tag.
services:
  # Speech-to-text: faster-whisper behind an OpenAI-compatible API.
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    ports:
      - "8000:8000"
    volumes:
      - speaches-models:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

  # Chat model: any open-weight model Ollama can run.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  # Text-to-speech: Kokoro behind an OpenAI-compatible API.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
    restart: unless-stopped

volumes:
  speaches-models:
  ollama-models:
