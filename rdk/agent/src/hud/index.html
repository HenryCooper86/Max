<!doctype html>
<meta charset="utf-8" />
<title>Max · RDK X5 bench</title>
<style>
  body {
    margin: 0;
    background: #0b0d10;
    color: #e6edf3;
    font:
      14px/1.5 ui-monospace,
      monospace;
    padding: 16px;
  }
  h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7d8590;
  }
  .row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card {
    background: #12161b;
    border: 1px solid #21262d;
    border-radius: 8px;
    padding: 12px;
    flex: 1 1 320px;
  }
  img {
    width: 100%;
    border-radius: 6px;
    background: #000;
  }
  .rider {
    color: #7ee787;
  }
  .agent {
    color: #79c0ff;
  }
  .partial {
    opacity: 0.6;
  }
  dt {
    color: #7d8590;
    float: left;
    width: 96px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .tile {
    border: 1px solid #21262d;
    border-radius: 6px;
    overflow: hidden;
    background: #0b0d10;
  }
  .tile img {
    display: block;
    aspect-ratio: 16 / 9;
    object-fit: cover;
  }
  .tile .meta {
    padding: 6px 8px;
    font-size: 12px;
    color: #7d8590;
  }
  .muted {
    color: #7d8590;
  }
  .missing {
    padding: 24px 8px;
    text-align: center;
    color: #f85149;
    font-size: 12px;
  }
  .recording {
    padding: 24px 8px;
    text-align: center;
    color: #d29922;
    font-size: 12px;
  }
  .tile.live {
    border-color: #d29922;
  }
</style>
<h1>Max · RDK X5 bench</h1>
<div class="row">
  <div class="card">
    <dl>
      <dt>connection</dt>
      <dd id="connection">–</dd>
      <dt>turn</dt>
      <dd id="turn">–</dd>
      <dt>latency</dt>
      <dd id="latency">–</dd>
      <dt>error</dt>
      <dd id="error">–</dd>
    </dl>
  </div>
  <div class="card"><img id="front" alt="front camera" /></div>
  <div class="card"><img id="rear" alt="rear camera" /></div>
</div>
<div class="card" style="margin-top: 16px"><div id="transcript"></div></div>
<div class="card" style="margin-top: 16px">
  <h1 style="margin-top: 0">captures</h1>
  <div id="captures-status" class="muted">loading…</div>
  <div id="captures" class="grid"></div>
</div>
<script>
  const host = location.hostname;
  document.getElementById("front").src = `http://${host}:__PREVIEW_PORT__/preview/front`;
  document.getElementById("rear").src = `http://${host}:__PREVIEW_PORT__/preview/rear`;

  const socket = new WebSocket(`ws://${location.host}`);
  socket.onmessage = (message) => {
    const state = JSON.parse(message.data);
    document.getElementById("connection").textContent = state.connection;
    document.getElementById("turn").textContent = state.turnState;
    document.getElementById("latency").textContent = state.latencyMs === null ? "–" : `${state.latencyMs} ms`;
    document.getElementById("error").textContent = state.lastError ?? "–";
    document.getElementById("transcript").innerHTML = state.transcript
      .map((turn) => `<div class="${turn.speaker} ${turn.final ? "" : "partial"}">${turn.speaker}: ${turn.text}</div>`)
      .join("");
  };

  const galleryBase = `http://${host}:__PREVIEW_PORT__`;
  const capturesEl = document.getElementById("captures");
  const statusEl = document.getElementById("captures-status");
  let lastSerialised = null;

  function tile(pair) {
    const side = pair.front ? "front" : "rear";
    const name = pair[side];
    const bytes = pair.sizes ? pair.sizes[side] : null;
    const href = `${galleryBase}/gallery/${pair.id}/${name}`;
    // A recording is concatenated JPEG: show frame one, link the file.
    const isVideo = pair.kind === "video";
    const src = isVideo ? `${href}/thumb` : href;
    // A clip is listed from the moment it starts, so say which ones are still
    // growing — otherwise a live recording reads as a finished one whose size
    // keeps changing between refreshes.
    const label = pair.recording ? "video · recording" : isVideo ? "video" : "photo";
    const size = bytes === null ? "waiting for the first frame" : `${Math.round(bytes / 1024)} KB`;

    if (bytes === null) {
      const missing = pair.recording ? "recording…" : "file missing";
      return `<div class="tile"><div class="${pair.recording ? "recording" : "missing"}">${missing}</div>
        <div class="meta">${pair.id}<br />${label} · ${size}</div></div>`;
    }
    return `<div class="tile ${pair.recording ? "live" : ""}"><a href="${href}" target="_blank">
      <img src="${src}" alt="${pair.id}" /></a>
      <div class="meta">${pair.id}<br />${label} · ${size}${pair.degraded ? " · degraded" : ""}</div></div>`;
  }

  async function refreshCaptures() {
    let payload;
    try {
      const response = await fetch(`${galleryBase}/gallery`, { cache: "no-store" });
      payload = await response.json();
    } catch {
      // "Cannot reach the sidecar" and "nothing captured yet" must never look
      // the same. A blank panel that meant both cost an afternoon once.
      statusEl.textContent = "sidecar unreachable";
      return;
    }

    const serialised = JSON.stringify(payload.pairs);
    if (serialised === lastSerialised) return;
    lastSerialised = serialised;

    statusEl.textContent = payload.pairs.length ? "" : "no captures yet";
    capturesEl.innerHTML = payload.pairs.map(tile).join("");
  }

  refreshCaptures();
  setInterval(refreshCaptures, 3000);
</script>
