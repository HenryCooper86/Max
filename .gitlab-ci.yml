stages:
  - verify
  - release-gate

verify:
  stage: verify
  image: node:22-bookworm-slim
  script:
    - npm ci
    - npm run format:check
    - npm run lint
    - npm test
    - npm run test:fault-matrix
    - npm run build
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist/

live-release-gate:
  stage: release-gate
  image: node:22-bookworm-slim
  needs: [verify]
  rules:
    - if: "$TESTING_GATE_URL && $TESTING_GATE_TOKEN"
      when: manual
    - when: never
  script:
    - npm ci
    - TESTING_GATE_REPORT=artifacts/release-gate.json npm run test:release-gate
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/release-gate.json
