name: Release draft

# Pushing a tag prepares a draft GitHub release. Nothing is published from here:
# a maintainer reviews the draft and publishes it. For the SDK, the tarball
# attached to the draft (built and smoke-tested by npm run pack:sdk below) is
# the one to publish: npm publish max-voice-agent-<version>.tgz.
#
#   v1.2.3      the kit; must match "version" in package.json
#   sdk-v1.2.3  the web SDK; must match "version" in sdk/package.json

on:
  push:
    tags:
      - "v*"
      - "sdk-v*"

permissions:
  contents: write

jobs:
  # Every job of the cross-platform CI (relay, browsers, speech server and its image, relay image, devices,
  # Android, iOS) must pass for the tagged commit before a draft is made, not only the web checks.
  ci:
    uses: ./.github/workflows/ci.yml

  draft:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches the package version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == sdk-v* ]]; then
            manifest=sdk/package.json
            expected="sdk-v$(node -p "require('./sdk/package.json').version")"
            echo "kind=sdk" >> "$GITHUB_OUTPUT"
          else
            manifest=package.json
            expected="v$(node -p "require('./package.json').version")"
            echo "kind=kit" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$tag" != "$expected" ]]; then
            echo "Tag $tag does not match $manifest (expected $expected)." >&2
            exit 1
          fi
      - run: npm ci
      # `npm run check` already ran in the ci job above.
      - name: Pack the SDK
        if: steps.version.outputs.kind == 'sdk'
        run: npm run pack:sdk
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          if [[ "${{ steps.version.outputs.kind }}" == "sdk" ]]; then
            assets=(dist/max-voice-agent-*.tgz)
          fi
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag "${assets[@]}"
