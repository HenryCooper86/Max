name: Cross-platform CI

# Pull requests run once (not once for the push and again for the pull request).
# To run the checks on a branch that has no pull request, start the workflow by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=low

  rdk-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: rdk/vision/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python -m pip install -r rdk/vision/requirements-dev.txt
      - run: npm run test:rdk-vision

  speech-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: speech-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: speech-server/uv.lock
      - run: uv sync --frozen
      # Model-free by default: tests marked `models` skip unless MAX_SPEECH_MODEL_TESTS=1.
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  speech-server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      # CPU target only. The cuda target is about 4 GB and cannot be run without a GPU, so CI does not build it.
      - uses: docker/build-push-action@v7
        with:
          context: speech-server
          target: cpu
          push: false
          load: true
          tags: max-speech:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Entrypoint refuses to start without SPEECH_API_KEY
        run: |
          set +e
          docker run --rm max-speech:ci
          code=$?
          echo "exit code: $code"
          test "$code" -eq 64

  # The Python reference client in examples/device-client, against a scripted relay.
  device-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'websockets>=10'
      - run: python -m unittest discover -s examples/device-client -p 'test_*.py' -v

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # v3 defaults to the removed legacy "tools" package. Match AGP's SDK selection.
          packages: "platform-tools platforms;android-36.1 build-tools;36.0.0"
      - run: chmod +x android/gradlew
      - run: android/gradlew -p android test lint
      # Unsigned: proves the release variant still builds and packages.
      - run: android/gradlew -p android assembleRelease -PversionCode=${{ github.run_number }}

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
          working-directory: ios
      - name: Install iOS dependencies
        working-directory: ios
        run: bundle exec pod install --deployment
      - name: Select a simulator
        id: simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            phone = devices.find { |device| device["name"].start_with?("iPhone") && device["isAvailable"] }
            abort "No available iPhone simulator" unless phone
            puts phone.fetch("udid")
          ')
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild \
            -workspace ios/MaxHelmet.xcworkspace \
            -scheme MaxHelmet \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            MAX_GIT_COMMIT="${GITHUB_SHA::12}" \
            MAX_BUILD_NUMBER="${{ github.run_number }}" \
            test
